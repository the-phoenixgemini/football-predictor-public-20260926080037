name: Football Predictor code and history checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source and historical data
        run: python verify_v09.py
      - name: Verify user-entered match and implied fair odds
        run: python verify_manual_v11.py
      - name: Verify fixture report with offline stub
        run: python verify_v08.py
